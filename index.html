<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Ontario Electricity Demand Monitor</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #020617;
      color: #e2e8f0;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }

    header {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
    }

    .container {
      max-width: 1150px;
      margin: auto;
      padding: 24px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 { font-size: 25px; margin: 0; }
    h2 { font-size: 19px; margin: 0 0 12px; }
    p { line-height: 1.6; margin: 8px 0; }
    a { color: #7dd3fc; }
    .muted { color: #94a3b8; }
    .small { font-size: 13px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      margin: 24px 0;
    }

    .panel {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 24px;
      min-width: 0;
    }

    .label {
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 12px;
    }

    .metric {
      font-size: 34px;
      font-weight: 800;
      color: #38bdf8;
      margin-top: 14px;
      overflow-wrap: anywhere;
    }

    .period { font-size: 23px; line-height: 1.5; }

    .banner {
      padding: 20px;
      border: 1px solid #475569;
      border-radius: 14px;
      background: #0f172a;
    }

    .banner[data-kind="ok"] {
      background: #082f49;
      border-color: #0369a1;
    }

    .banner[data-kind="warning"] {
      background: #422006;
      border-color: #a16207;
    }

    .banner[data-kind="error"] {
      background: #450a0a;
      border-color: #b91c1c;
    }

    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }

    button {
      background: #0369a1;
      color: white;
      border: 1px solid #0284c7;
      border-radius: 9px;
      padding: 11px 16px;
      font: inherit;
      cursor: pointer;
    }

    button:hover { background: #075985; }
    button:disabled { opacity: .5; cursor: wait; }

    svg {
      display: block;
      width: 100%;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 10px;
    }

    .chart-labels {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin: 10px 0;
      font-size: 12px;
      color: #94a3b8;
    }

    .table-scroll {
      max-height: 320px;
      overflow: auto;
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #1e293b;
    }

    th { color: #94a3b8; }

    .wrap { overflow-wrap: anywhere; }

    hr {
      border: 0;
      border-top: 1px solid #334155;
      margin: 20px 0;
    }

    @media (max-width: 800px) {
      .cards, .layout { grid-template-columns: 1fr; }
      .container { padding: 16px; }
      h1 { font-size: 21px; }
    }
  </style>
</h
